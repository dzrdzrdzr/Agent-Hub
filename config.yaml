# Safe baseline configuration.
# Put machine-specific paths, proxies, and environment variables in
# config.local.yaml and point AGENT_HUB_CONFIG to that file.

agentd:
  ipc:
    transport: tcp
    tcp_host: 127.0.0.1
    tcp_port: 19876

  cline:
    executable: auto
    timeout_seconds: 600
    stall_threshold_seconds: 300
    max_retries: 1
    mock: false
    mock_exit_code: 0
    mock_delay_seconds: 1.0
    kill_on_shutdown: false
    retention_days: 30
    max_task_history: 1000
    env: {}

  database:
    path: .agent-hub/state.sqlite

  logs:
    dir: .agent-hub/logs/

  safety:
    protected_paths: []
    forbidden_commands: []
    allow_network: false
    max_execution_time_seconds: 3600
