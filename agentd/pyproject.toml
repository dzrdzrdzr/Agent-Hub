[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub-daemon"
version = "0.2.0"
description = "Local supervisor for long-running OpenAI Codex, ChatGPT-authenticated Codex, Cline and DeepSeek coding-agent tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Zaidao Han" }
]
keywords = [
    "chatgpt",
    "openai-codex",
    "codex",
    "codex-cli",
    "ai-agents",
    "coding-agents",
    "long-running-agents",
    "agent-orchestration",
    "agent-watchdog",
    "cline",
    "deepseek",
    "process-supervisor",
    "remote-ssh",
    "vscode"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools"
]
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.0",
]

[project.scripts]
agent-hub = "agent_hub.cli:main"
agent-hub-daemon = "agent_hub.main:run"

[project.urls]
Homepage = "https://github.com/dzrdzrdzr/Agent-Hub"
Repository = "https://github.com/dzrdzrdzr/Agent-Hub"
Documentation = "https://github.com/dzrdzrdzr/Agent-Hub#readme"
Issues = "https://github.com/dzrdzrdzr/Agent-Hub/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_hub*"]
